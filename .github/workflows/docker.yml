# Build + push the Rampart container image.
#
# Triggers:
#   - push to main           → publish :main + :sha-<short> (multi-arch)
#   - workflow_call with tag → publish :<semver>, :<major.minor>, :latest, then
#                              sign (cosign keyless) and attest provenance + SBOM.
#                              Called by release-please.yml when a release is cut.
#   - workflow_dispatch      → publish :manual-<sha> (manual smoke push)
#
# All images are pushed to GHCR under the calling repo's namespace.
#
# Multi-arch strategy:
#
#   Each architecture builds on its own native runner (amd64 on
#   `ubuntu-latest`, arm64 on `ubuntu-24.04-arm`). The two per-arch
#   pushes use docker/build-push-action's digest-only mode (no tag);
#   a final job pulls both digests and assembles them into the
#   user-facing multi-arch tag via `docker buildx imagetools create`.
#
#   The previous layout built both arches sequentially on one amd64
#   runner using QEMU. arm64 under QEMU runs Rust compilation
#   ~5-10x slower; with no warm buildcache on the first push, the
#   serial build exceeded 2 hours. Native arm64 + parallel matrix
#   keeps each leg under 30 minutes and the assemble step adds
#   ~30 seconds.

name: docker

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.159.0)"
        required: true
        type: string
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE:    ${{ github.repository }}

jobs:
  # ── per-arch builds in parallel ───────────────────────────────────
  build:
    name: build · ${{ matrix.platform.tag }}
    runs-on: ${{ matrix.platform.runner }}
    # Hard ceiling so a single arch can't hang the whole pipeline. The
    # 90-min cap is well above the observed P95 (~28 min cold-cache,
    # amd64) and well below the failure mode we just got out of
    # (>2h serial QEMU emulation).
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # push per-arch digests + buildcache

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { tag: amd64,  arch: linux/amd64, runner: ubuntu-latest }
          - { tag: arm64,  arch: linux/arm64, runner: ubuntu-24.04-arm }

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Derive labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}

      - name: Build + push (digest only)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file:    Dockerfile
          platforms: ${{ matrix.platform.arch }}
          # Push by digest only; the merge job tags the final manifest.
          # Two separate buildcache refs so amd64 and arm64 prime
          # independently — otherwise the first finisher overwrites the
          # second's layer set and we get a full rebuild next time.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels:  ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache-${{ matrix.platform.tag }}
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache-${{ matrix.platform.tag }},mode=max
          provenance: false

      - name: Export digest
        env:
          digest: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.platform.tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── merge per-arch digests into a single multi-arch tag ───────────
  merge:
    name: assemble manifest
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    permissions:
      packages:     write   # push the multi-arch manifest
      id-token:     write   # keyless signing + attestations (Sigstore)
      attestations: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,enable=${{ inputs.tag == '' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.tag != '' }}
            type=raw,value=manual-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create + push multi-arch manifest
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # `docker buildx imagetools create` takes one -t per tag and
          # accepts <image>@<digest> source refs.
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=("-t" "$tag")
          done <<< "$TAGS"

          digest_args=()
          for f in *; do
            digest_args+=("${REGISTRY}/${IMAGE}@sha256:${f}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect resulting manifest
        run: |
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE}:sha-${GITHUB_SHA::7}"

      # ── release only: sign + attest the published multi-arch image ──
      - name: Resolve image digest
        id: digest
        if: inputs.tag != ''
        env:
          tag: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${tag#v}" \
                     --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Signed SLSA build provenance, pushed to the registry next to the image.
      # Verify: gh attestation verify oci://ghcr.io/<owner>/<repo>:<version> -R <owner>/<repo>
      - name: Attest build provenance
        if: inputs.tag != ''
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Generate image SBOM
        if: inputs.tag != ''
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        if: inputs.tag != ''
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # Keyless cosign signature (Sigstore, GitHub OIDC identity).
      # Verify: cosign verify ghcr.io/<owner>/<repo>:<version> \
      #   --certificate-identity-regexp 'https://github.com/<owner>/<repo>/.github/workflows/.*' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install cosign
        if: inputs.tag != ''
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign image
        if: inputs.tag != ''
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"
