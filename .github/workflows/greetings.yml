# Welcome first-time contributors so a real person isn't needed to say hi.
name: greetings

on:
  # Needs a write token on fork PRs to comment; never checks out or runs PR code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    # Gate on GitHub's own author_association: first-interaction's history
    # lookup greeted everyone (owner and bots included) on every PR.
    if: >-
      contains(fromJSON('["FIRST_TIME_CONTRIBUTOR","FIRST_TIMER"]'),
               github.event.pull_request.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: >
            Thanks for opening your first issue in Rampart! A maintainer will triage it.
            If this is a usage question rather than a bug, Discussions is a faster path.
          pr_message: >
            Thanks for your first PR to Rampart! Please make sure CI is green and the
            checklist in the PR template is filled in. A maintainer will review soon.
