# Build the standalone binaries for a release and attach them, with
# SHA-256 sums, build-provenance attestations and an SBOM, to the GitHub
# release that Release Please already published (see release-please.yml,
# which calls this workflow). The release notes come from Release Please;
# this workflow only adds assets.
#
# Manual rebuild of an existing release: Actions -> release -> Run workflow.
name: release

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.159.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (e.g. v0.159.0)"
        required: true

permissions:
  contents: write       # upload release assets
  id-token: write       # sign build-provenance attestations (Sigstore)
  attestations: write   # store attestations

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      # Frontend bundle is embedded into the binary by rust-embed. Build
      # it first so the release artifact is fully self-contained.
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p ~/.cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> ~/.cargo/config.toml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Build release binary
        working-directory: backend
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release -p rampart-api --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          BIN=backend/target/${{ matrix.target }}/release/rampart-api
          OUT=rampart-${{ matrix.target }}
          mkdir -p dist
          cp "$BIN" "dist/${OUT}"
          (cd dist && shasum -a 256 "${OUT}" > "${OUT}.sha256")

      # Signed SLSA build provenance for each binary; verify with
      # `gh attestation verify <file> -R <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/rampart-${{ matrix.target }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --clobber \
            dist/rampart-${{ matrix.target }} \
            dist/rampart-${{ matrix.target }}.sha256

  # Software bill of materials for the source tree (Cargo + npm dependencies),
  # attached to the release as SPDX JSON.
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: rampart-${{ inputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --clobber "rampart-${{ inputs.tag }}.spdx.json"
