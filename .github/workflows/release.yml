# Build the standalone binaries for a release and attach them, with
# SHA-256 sums, build-provenance attestations and an SBOM, to the GitHub
# release that Release Please already published (see release-please.yml,
# which calls this workflow). The release notes come from Release Please;
# this workflow only adds assets.
#
# Manual rebuild of an existing release: Actions -> release -> Run workflow.
name: release

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.159.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (e.g. v0.159.0)"
        required: true

permissions: {}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write       # upload release assets
      id-token: write       # sign build-provenance attestations (Sigstore)
      attestations: write   # store attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      # Frontend bundle is embedded into the binary by rust-embed. Build
      # it first so the release artifact is fully self-contained.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal -t "$TARGET" && rustup default stable

      - name: Install cross-linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p ~/.cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> ~/.cargo/config.toml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Build release binary
        working-directory: backend
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release -p rampart-api --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          BIN=backend/target/${{ matrix.target }}/release/rampart-api
          OUT=rampart-${{ matrix.target }}
          mkdir -p dist
          cp "$BIN" "dist/${OUT}"
          (cd dist && shasum -a 256 "${OUT}" > "${OUT}.sha256")

      # Signed SLSA build provenance for each binary; verify with
      # `gh attestation verify <file> -R <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/rampart-${{ matrix.target }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            "dist/rampart-${TARGET}" \
            "dist/rampart-${TARGET}.sha256"

  # Software bill of materials for the source tree (Cargo + npm dependencies),
  # attached to the release as SPDX JSON.
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload the SBOM release asset
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: rampart-${{ inputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "rampart-${TAG}.spdx.json"
