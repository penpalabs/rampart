# Blocks PRs that introduce dependencies with known vulnerabilities or
# disallowed licenses. Runs only on PRs (needs the base..head diff).
name: dependency-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # AGPL-3.0 project — copyleft is fine inbound, but flag the
          # obviously-incompatible proprietary-ish licenses.
          deny-licenses: "GPL-2.0-only, LGPL-2.0-only"
