# Git hooks for Rampart, managed by pre-commit. Details: docs/security-scanning.md
#
# One-time setup per clone:
#   brew install pre-commit gitleaks actionlint     # or pip install pre-commit + release binaries
#   pre-commit install            # installs ALL hook types below (default_install_hook_types)
#   pre-commit run --all-files    # check everything once
#
# What runs when:
#   git commit  -> pre-commit stage:  gitleaks on the staged changes, trufflehog (verified
#                                     secrets), file hygiene, shellcheck, cargo fmt,
#                                     zizmor + actionlint (only when workflows change)
#               -> commit-msg stage:  gitleaks on the commit MESSAGE
#   git push    -> pre-push stage:    gitleaks on the FULL git history (incl. all messages)
# The `security` workflow runs the same scanners in CI, so --no-verify is not a bypass.
#
# Remote hooks are pinned to commit SHAs. Update with: pre-commit autoupdate --freeze

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner -v --config .gitleaks.toml
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # pre-commit passes the commit-message file path as $1
      - id: gitleaks-commit-msg
        name: gitleaks (commit message)
        entry: sh -c 'gitleaks stdin --redact --no-banner -v --config .gitleaks.toml < "$1"' --
        language: system
        stages: [commit-msg]

      - id: gitleaks-history
        name: gitleaks (full history before push)
        entry: gitleaks git . --redact --no-banner -v --config .gitleaks.toml
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      # `cargo fmt --all -- --check` in backend/, only when Rust files or manifests change.
      - id: cargo-fmt
        name: cargo fmt --all
        entry: bash -c 'cd backend && cargo fmt --all -- --check'
        language: system
        files: \.(rs|toml)$
        pass_filenames: false

  # GitHub Actions security: unpinned actions, credential persistence, injection, permissions
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c7d31dc612dffdd4d3b2f2b88b9660d3ab057ee8  # frozen: v1.33.1
    hooks:
      - id: zizmor

  # Verified secrets only (live credentials), complements gitleaks' pattern matching
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: b06f6d72a3791308bb7ba59c2b8cb7a083bd17e4  # frozen: v3.88.26
    hooks:
      - id: trufflehog
        name: TruffleHog
        entry: trufflehog git file://. --since-commit HEAD --results=verified --fail
        language: golang
        pass_filenames: false

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a23f6b85d0fdd5bb9d564e2579e678033debbdff  # frozen: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-toml
      - id: check-yaml
        # --unsafe: syntax-only parse, so custom tags (mkdocs' !!python/name,
        # compose's !reset) pass. Helm templates use Go template directives,
        # which aren't YAML at all; `helm lint` validates them in CI instead.
        args: [--allow-multiple-documents, --unsafe]
        exclude: ^charts/.*/templates/.*\.ya?ml$
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
